<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balajee Diagonastic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Force classic JSX (React.createElement). Automatic runtime injects ESM `import` and crashes.
    Babel.registerPreset("react-classic", function () {
      return {
        presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
      };
    });
  </script>
  <!-- UMD build required for browser <script> (not ESM) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .bar-fill { transition: width 0.35s ease; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <!-- ============================================================
       STEP 1: apni Supabase details yahan daalo (dono values
       Supabase > Project Settings > API me milti hain)
       ============================================================ -->
  <script>
    window.SUPABASE_URL = "https://ynrikqfjinobfjgfghwn.supabase.co";
    window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucmlrcWZqaW5vYmZqZ2ZnaHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyODQzNzksImV4cCI6MjEwNDg2MDM3OX0.bY_qfYh0YPKPpt1TpbyUwMjJl22m3O-8ypqgMEB6u7U";
  </script>

  <script type="text/babel" data-presets="react-classic">
    /** @jsxRuntime classic */
    const { useState, useEffect, useMemo, useRef } = React;

    const CONFIGURED =
      window.SUPABASE_URL &&
      !window.SUPABASE_URL.includes("YOUR_") &&
      window.SUPABASE_ANON_KEY &&
      !window.SUPABASE_ANON_KEY.includes("YOUR_");

    const db = CONFIGURED
      ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
      : null;

    const money = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");
    const today = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    };
    function addDays(iso, n) {
      const d = new Date(iso + "T12:00:00");
      d.setDate(d.getDate() + n);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }
    function daysInRange(from, to) {
      const out = [];
      if (!from || !to || from > to) return out;
      let cur = from;
      for (let i = 0; i < 62 && cur <= to; i++) {
        out.push(cur);
        cur = addDays(cur, 1);
      }
      return out;
    }
    const inputCls =
      "w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500";

    const SESSION_KEY = "balajee_session_v1";
    function readSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (!s || !s.username) return null;
        return { username: String(s.username), role: s.role || "user", name: s.name || s.username };
      } catch (e) { return null; }
    }
    function writeSession(s) {
      try { localStorage.setItem(SESSION_KEY, JSON.stringify({ username: s.username, role: s.role, name: s.name })); } catch (e) {}
    }
    function clearSession() {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    }

    function mapPatient(r) {
      if (!r) return r;
      return {
        ...r,
        total: Number(r.total || 0),
        paid: Number(r.paid || 0),
        dues: Number(r.dues || 0),
        payments: r.payments || [],
        report_status: normalizeReport(r.report_status),
        admin_payment_status: normalizeAdminPay(r.admin_payment_status),
      };
    }
    function inDateRange(isoDate, from, to) {
      if (!isoDate) return false;
      if (from && isoDate < from) return false;
      if (to && isoDate > to) return false;
      return true;
    }
    function paymentsOnRecord(r) {
      const list = Array.isArray(r.payments) ? r.payments : [];
      if (list.length) return list.map((p) => ({
        amount: Number(p.amount || 0),
        date: p.date || r.date,
        by: p.by || r.created_by || "",
        mode: p.mode || "",
      }));
      if (Number(r.paid || 0) > 0) {
        return [{ amount: Number(r.paid), date: r.date, by: r.created_by || "", mode: r.mode || "" }];
      }
      return [];
    }

    const REPORT_OPTIONS = ["Report Pending", "Report Generated", "Report Send"];
    function normalizeReport(v) {
      return REPORT_OPTIONS.includes(v) ? v : "Report Pending";
    }
    function reportBadgeClass(v) {
      const s = normalizeReport(v);
      if (s === "Report Generated") return "bg-sky-100 text-sky-700";
      if (s === "Report Send") return "bg-emerald-100 text-emerald-700";
      return "bg-amber-100 text-amber-700";
    }

    /* Admin-only: staff ne patient se paisa liya → admin ne staff se receive kiya ya nahi */
    const ADMIN_PAY_OPTIONS = ["Payment Pending", "Payment Received"];
    function normalizeAdminPay(v) {
      return ADMIN_PAY_OPTIONS.includes(v) ? v : "Payment Pending";
    }
    function adminPayBadgeClass(v) {
      return normalizeAdminPay(v) === "Payment Received"
        ? "bg-emerald-100 text-emerald-700"
        : "bg-orange-100 text-orange-700";
    }

    function fmtTime(iso) {
      try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
      catch (e) { return ""; }
    }
    function fmtDay(iso) {
      try { return new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); }
      catch (e) { return ""; }
    }

    /* -------------------- data layer (Supabase) -------------------- */
    async function listPatients() {
      const { data, error } = await db.from("patients").select("*").order("created_at", { ascending: false });
      if (error) throw error;
      return (data || []).map(mapPatient);
    }
    async function insertPatient(rec) {
      const { data, error } = await db.from("patients").insert(rec).select().single();
      if (error) throw error;
      return data;
    }
    async function updatePatient(id, patch) {
      const { data, error } = await db.from("patients").update(patch).eq("id", id).select().single();
      if (error) throw error;
      return data;
    }
    async function deletePatient(id) {
      const { error } = await db.from("patients").delete().eq("id", id);
      if (error) throw error;
    }
    async function listUsers() {
      const { data, error } = await db.from("app_users").select("*");
      if (error) throw error;
      const map = {};
      (data || []).forEach((u) => (map[u.username] = u));
      return map;
    }
    async function upsertUser(u) {
      const { error } = await db.from("app_users").upsert(u);
      if (error) throw error;
    }
    async function removeUserRow(username) {
      const { error } = await db.from("app_users").delete().eq("username", username);
      if (error) throw error;
    }
    async function logActivity(a) {
      try { await db.from("activity").insert(a); } catch (e) {}
    }
    async function listActivity() {
      const { data, error } = await db.from("activity").select("*").order("created_at", { ascending: false }).limit(300);
      if (error) throw error;
      return data || [];
    }

    /* -------------------- notifications (service worker) -------------------- */
    let SW_REG = null;
    async function ensureSW() {
      if (!("serviceWorker" in navigator)) return null;
      try { SW_REG = await navigator.serviceWorker.register("sw.js"); return SW_REG; }
      catch (e) { return null; }
    }
    async function showSystemNotification(title, body) {
      try {
        if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
        let reg = SW_REG;
        if (!reg && navigator.serviceWorker) { try { reg = await navigator.serviceWorker.ready; } catch (e) {} }
        if (reg && reg.showNotification) reg.showNotification(title, { body, tag: "dc-" + Date.now() });
        else new Notification(title, { body }); // desktop fallback
      } catch (e) {}
    }

    /* ============================ APP ============================ */
    function App() {
      const [session, setSession] = useState(() => readSession());
      const [users, setUsers] = useState({});
      const [records, setRecords] = useState([]);
      const [booting, setBooting] = useState(true);
      const [view, setView] = useState("entry");
      const [loadErr, setLoadErr] = useState("");
      const [live, setLive] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [notifPerm, setNotifPerm] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
      const [notifDismissed, setNotifDismissed] = useState(false);
      const sessionRef = useRef(null);
      const refreshTimer = useRef(null);
      useEffect(() => { sessionRef.current = session; }, [session]);
      useEffect(() => { ensureSW(); }, []);

      function login(s) {
        writeSession(s);
        setSession(s);
        logActivity({
          username: s.username, user_name: s.name, action: "login",
          bill_no: "", patient_name: "", detail: "Signed in", amount: null,
        });
      }
      function logout() {
        clearSession();
        setSession(null);
      }

      function pushToast(t) {
        const id = Date.now() + Math.random();
        setToasts((arr) => [...arr.slice(-4), { ...t, id }]);
        setTimeout(() => setToasts((arr) => arr.filter((x) => x.id !== id)), 5500);
      }
      function notify(kind, row, amt) {
        let title, body, tone;
        if (kind === "entry") {
          title = "New patient entry";
          body = `${row.customer_name} · ${row.test_name || ""} (${row.created_by || "staff"})`;
          tone = "teal";
        } else {
          const by = row.payments && row.payments.length ? row.payments[row.payments.length - 1].by : "staff";
          title = "Due cleared";
          body = `${row.customer_name} · ${money(amt)} (${by})`;
          tone = "emerald";
        }
        pushToast({ title, body, tone });
        showSystemNotification(title, body);
      }
      async function enableNotifs() {
        if (typeof Notification === "undefined") { setNotifPerm("unsupported"); return; }
        await ensureSW();
        try { const p = await Notification.requestPermission(); setNotifPerm(p); } catch (e) {}
      }

      async function refreshRecords() {
        try {
          setRecords(await listPatients());
          setLoadErr("");
        } catch (e) {
          setLoadErr(e.message || "Data load nahi ho paya.");
        }
      }
      function scheduleRefresh() {
        if (refreshTimer.current) clearTimeout(refreshTimer.current);
        refreshTimer.current = setTimeout(() => { refreshRecords(); }, 1200);
      }
      function patchPatient(event, payload) {
        setRecords((prev) => {
          if (event === "INSERT") {
            const row = mapPatient(payload.new);
            if (!row || !row.id) return prev;
            if (prev.some((p) => p.id === row.id)) return prev;
            return [row, ...prev];
          }
          if (event === "UPDATE") {
            const row = mapPatient(payload.new);
            if (!row || !row.id) return prev;
            let found = false;
            const next = prev.map((p) => {
              if (p.id !== row.id) return p;
              found = true;
              return row;
            });
            return found ? next : [row, ...prev];
          }
          if (event === "DELETE") {
            const id = payload.old && payload.old.id;
            if (!id) return prev;
            return prev.filter((p) => p.id !== id);
          }
          return prev;
        });
        scheduleRefresh();
      }
      async function reloadUsers() {
        try {
          const map = await listUsers();
          setUsers(map);
          const saved = readSession();
          if (saved && map[saved.username]) {
            const u = map[saved.username];
            const next = { username: saved.username, role: u.role, name: u.name };
            writeSession(next);
            setSession(next);
          } else if (saved && Object.keys(map).length && !map[saved.username]) {
            clearSession();
            setSession(null);
          }
        } catch (e) { setLoadErr(e.message); }
      }

      useEffect(() => {
        if (!CONFIGURED) { setBooting(false); return; }
        let channel;
        (async () => {
          await reloadUsers();
          await refreshRecords();
          setBooting(false);
          channel = db
            .channel("realtime-dc")
            .on("postgres_changes", { event: "INSERT", schema: "public", table: "patients" }, (payload) => {
              const row = payload.new || {};
              if (row.created_by && row.created_by !== (sessionRef.current && sessionRef.current.username)) notify("entry", row);
              patchPatient("INSERT", payload);
            })
            .on("postgres_changes", { event: "UPDATE", schema: "public", table: "patients" }, (payload) => {
              const row = payload.new || {}, old = payload.old || {};
              const inc = Number(row.paid || 0) - Number(old.paid || 0);
              if (inc > 0) {
                const by = row.payments && row.payments.length ? row.payments[row.payments.length - 1].by : null;
                if (by !== (sessionRef.current && sessionRef.current.username)) notify("due", row, inc);
              }
              patchPatient("UPDATE", payload);
            })
            .on("postgres_changes", { event: "DELETE", schema: "public", table: "patients" }, (payload) => patchPatient("DELETE", payload))
            .on("postgres_changes", { event: "*", schema: "public", table: "app_users" }, () => reloadUsers())
            .subscribe((status) => setLive(status === "SUBSCRIBED"));
        })();
        return () => {
          if (channel) db.removeChannel(channel);
          if (refreshTimer.current) clearTimeout(refreshTimer.current);
        };
      }, []);

      if (!CONFIGURED) return <SetupScreen />;
      if (booting)
        return <div className="min-h-screen flex items-center justify-center text-slate-500">Connecting…</div>;
      if (!session) return <Login users={users} onLogin={login} err={loadErr} />;

      const isAdmin = session.role === "admin";
      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
          <Header session={session} live={live} onLogout={logout} />

          {toasts.length > 0 && (
            <div className="fixed top-3 inset-x-0 z-40 flex flex-col items-center gap-2 px-3 pointer-events-none">
              {toasts.map((t) => (
                <div key={t.id} className={"pointer-events-auto w-full max-w-sm bg-white shadow-lg rounded-xl border-l-4 px-4 py-3 " + (t.tone === "teal" ? "border-teal-500" : "border-emerald-500")}>
                  <div className="text-sm font-semibold text-slate-800">{t.tone === "teal" ? "🆕 " : "✅ "}{t.title}</div>
                  <div className="text-xs text-slate-500 mt-0.5">{t.body}</div>
                </div>
              ))}
            </div>
          )}

          <main className="flex-1 w-full max-w-3xl mx-auto px-4 pb-24 pt-4">
            {notifPerm === "default" && !notifDismissed && (
              <div className="mb-4 bg-teal-50 border border-teal-200 text-teal-800 text-sm px-3 py-2.5 rounded-lg flex items-center justify-between gap-2">
                <span>🔔 Nayi entry / due-clear pe phone notification chahiye?</span>
                <span className="flex gap-2 shrink-0">
                  <button onClick={enableNotifs} className="bg-teal-700 text-white px-3 py-1.5 rounded-lg text-xs">Enable</button>
                  <button onClick={() => setNotifDismissed(true)} className="text-teal-700 text-xs px-1">Later</button>
                </span>
              </div>
            )}
            {notifPerm === "denied" && !notifDismissed && (
              <div className="mb-4 bg-amber-50 border border-amber-200 text-amber-800 text-xs px-3 py-2.5 rounded-lg flex items-center justify-between gap-2">
                <span>Notifications block hain. Phone alert ke liye browser settings me is site ko allow karo. (In-app alerts phir bhi chalenge.)</span>
                <button onClick={() => setNotifDismissed(true)} className="text-amber-800 px-1">✕</button>
              </div>
            )}
            {loadErr && (
              <div className="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2.5 rounded-lg">
                ⚠️ {loadErr}
              </div>
            )}
            {view === "entry" && <NewEntry session={session} onSaved={refreshRecords} setView={setView} />}
            {view === "records" && <Records records={records} session={session} refresh={refreshRecords} />}
            {view === "dashboard" && isAdmin && <Dashboard records={records} users={users} />}
            {view === "activity" && isAdmin && <Activity />}
            {view === "users" && isAdmin && <ManageUsers users={users} reload={reloadUsers} />}
          </main>
          <BottomNav view={view} setView={setView} isAdmin={isAdmin} />
        </div>
      );
    }

    /* -------------------- Setup screen -------------------- */
    function SetupScreen() {
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="max-w-md bg-white border border-slate-200 rounded-2xl p-6 text-sm text-slate-600">
            <div className="text-3xl mb-2">🔌</div>
            <h1 className="text-lg font-semibold text-slate-800 mb-2">Supabase connect karna baaki hai</h1>
            <p className="mb-3">
              Is file ke top me <code className="bg-slate-100 px-1 rounded">SUPABASE_URL</code> aur{" "}
              <code className="bg-slate-100 px-1 rounded">SUPABASE_ANON_KEY</code> apni values se replace karo,
              phir dobara open karo. Details SETUP guide me hain.
            </p>
          </div>
        </div>
      );
    }

    /* -------------------- Header + Nav -------------------- */
    function Header({ session, live, onLogout }) {
      return (
        <header className="bg-teal-800 text-white sticky top-0 z-20 shadow-sm">
          <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center text-lg">🩺</div>
              <div className="leading-tight">
                <div className="font-semibold flex items-center gap-1.5">
                  Balajee Diagonastic
                  <span title={live ? "Live sync on" : "Connecting…"}
                    className={"inline-block w-2 h-2 rounded-full " + (live ? "bg-emerald-400" : "bg-amber-400")}></span>
                </div>
                <div className="text-[11px] text-teal-200">{session.name} · {session.role === "admin" ? "Admin" : "Staff"}</div>
              </div>
            </div>
            <button onClick={onLogout} className="text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg">Logout</button>
          </div>
        </header>
      );
    }
    function BottomNav({ view, setView, isAdmin }) {
      const tabs = [
        { id: "entry", label: "New Entry", icon: "➕" },
        { id: "records", label: "Records", icon: "📋" },
      ];
      if (isAdmin) {
        tabs.push({ id: "dashboard", label: "Dashboard", icon: "📊" });
        tabs.push({ id: "activity", label: "Activity", icon: "🕑" });
        tabs.push({ id: "users", label: "Users", icon: "👥" });
      }
      return (
        <nav className="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-20">
          <div className="max-w-3xl mx-auto grid" style={{ gridTemplateColumns: `repeat(${tabs.length},1fr)` }}>
            {tabs.map((t) => (
              <button key={t.id} onClick={() => setView(t.id)}
                className={"flex flex-col items-center py-2.5 text-xs gap-0.5 " + (view === t.id ? "text-teal-700 font-medium" : "text-slate-400")}>
                <span className="text-lg">{t.icon}</span>{t.label}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    /* -------------------- Login -------------------- */
    function Login({ users, onLogin, err }) {
      const [u, setU] = useState(""); const [p, setP] = useState(""); const [e, setE] = useState("");
      const [showPass, setShowPass] = useState(false);
      function submit() {
        const key = u.trim().toLowerCase();
        const found = users[key];
        if (!found || found.password !== p) { setE("Galat username ya password."); return; }
        onLogin({ username: key, role: found.role, name: found.name });
      }
      return (
        <div className="min-h-screen bg-teal-800 flex items-center justify-center px-4">
          <div className="w-full max-w-sm bg-white rounded-2xl shadow-xl p-7">
            <div className="text-center mb-6">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-teal-100 flex items-center justify-center text-3xl mb-3">🩺</div>
              <h1 className="text-xl font-bold text-slate-800">Balajee Diagonastic</h1>
              <p className="text-sm text-slate-500">Sign in to continue</p>
            </div>
            <label className="block text-sm font-medium text-slate-600 mb-1">Username</label>
            <input value={u} onChange={(ev) => setU(ev.target.value)} className={inputCls + " mb-3"} placeholder="admin / user1" autoComplete="username" />
            <label className="block text-sm font-medium text-slate-600 mb-1">Password</label>
            <div className="relative mb-3">
              <input
                type={showPass ? "text" : "password"}
                value={p}
                onChange={(ev) => setP(ev.target.value)}
                onKeyDown={(ev) => ev.key === "Enter" && submit()}
                className={inputCls + " pr-11"}
                placeholder="••••••••"
                autoComplete="current-password"
              />
              <button
                type="button"
                onClick={() => setShowPass((s) => !s)}
                className="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-slate-500 hover:text-slate-700"
                aria-label={showPass ? "Hide password" : "Show password"}
                title={showPass ? "Hide" : "Show"}
              >
                {showPass ? (
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
                ) : (
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                )}
              </button>
            </div>
            {(e || err) && <p className="text-sm text-red-600 mb-3">{e || err}</p>}
            <button onClick={submit} className="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-2.5 rounded-lg">Sign in</button>
            <div className="mt-5 text-xs text-slate-400 bg-slate-50 rounded-lg p-3 leading-relaxed">
              Default — Admin: <b>admin / admin@123</b><br/>Staff: <b>user1…user5 / user@123</b>
            </div>
          </div>
        </div>
      );
    }

    /* -------------------- Field helper -------------------- */
    function Field({ label, children, required }) {
      return (
        <label className="block">
          <span className="text-sm font-medium text-slate-600">{label} {required && <span className="text-red-500">*</span>}</span>
          <div className="mt-1">{children}</div>
        </label>
      );
    }

    /* -------------------- New Entry -------------------- */
    function NewEntry({ session, onSaved, setView }) {
      const blank = { date: today(), customer_name: "", age: "", sex: "", mobile: "", test_name: "", referred_by: "", total: "", advance: "", mode: "Cash", address: "", report_status: "Report Pending" };
      const [f, setF] = useState(blank);
      const [saving, setSaving] = useState(false);
      const [okMsg, setOkMsg] = useState(""); const [err, setErr] = useState("");
      const [count, setCount] = useState(0);
      const dues = Math.max(0, Number(f.total || 0) - Number(f.advance || 0));
      const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

      function validate() {
        if (!f.customer_name.trim()) return "Customer name daaliye.";
        if (!f.age || Number(f.age) <= 0) return "Sahi age daaliye.";
        if (!f.sex) return "Sex select kariye.";
        if (!/^\d{10}$/.test(f.mobile)) return "Mobile number 10 digit ka hona chahiye.";
        if (!f.test_name.trim()) return "Test name daaliye.";
        if (!f.total || Number(f.total) <= 0) return "Total amount daaliye.";
        if (Number(f.advance || 0) > Number(f.total)) return "Advance total se zyada nahi ho sakta.";
        return "";
      }

      async function save() {
        setOkMsg("");
        const v = validate();
        if (v) { setErr(v); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
        setErr(""); setSaving(true);
        const adv = Number(f.advance || 0); const total = Number(f.total);
        const payments = adv > 0 ? [{ amount: adv, date: f.date, mode: f.mode, by: session.username, note: "Advance" }] : [];
        const rec = {
          date: f.date, customer_name: f.customer_name.trim(), age: Number(f.age), sex: f.sex,
          mobile: f.mobile, test_name: f.test_name.trim(), referred_by: f.referred_by.trim(),
          address: f.address.trim(), total, paid: adv, dues: total - adv, mode: f.mode,
          payments, status: total - adv <= 0 ? "Paid" : "Pending",
          report_status: normalizeReport(f.report_status),
          admin_payment_status: "Payment Pending",
          created_by: session.username,
        };
        try {
          const saved = await insertPatient(rec);
          logActivity({
            username: session.username, user_name: session.name, action: "entry",
            bill_no: saved.bill_no, patient_name: rec.customer_name,
            detail: "Total " + money(total) + (adv > 0 ? ", advance " + money(adv) : ""), amount: total,
          });
          await onSaved();
          setF(blank); setCount((c) => c + 1); setOkMsg(saved.bill_no || "Saved");
        } catch (e) {
          setErr("Save nahi ho paya: " + (e.message || "network error"));
        } finally {
          setSaving(false); window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      return (
        <div>
          <div className="flex items-center justify-between mb-1">
            <h2 className="text-lg font-semibold">New Patient Entry</h2>
            {count > 0 && <span className="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full">{count} saved</span>}
          </div>
          <p className="text-sm text-slate-500 mb-4">Bill number auto-generate ho jayega.</p>

          {err && <div className="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-3 rounded-lg font-medium">⚠️ {err}</div>}
          {okMsg && (
            <div className="mb-4 bg-emerald-50 border border-emerald-300 text-emerald-800 text-sm px-3 py-3 rounded-lg flex items-center justify-between">
              <span>✅ <b>{okMsg}</b> saved.</span>
              <button className="ml-3 shrink-0 bg-emerald-600 text-white px-3 py-1.5 rounded-lg" onClick={() => setView("records")}>View</button>
            </div>
          )}

          <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <Field label="Date"><input type="date" value={f.date} onChange={set("date")} className={inputCls} /></Field>
              <Field label="Mobile No" required><input inputMode="numeric" maxLength={10} value={f.mobile} onChange={set("mobile")} className={inputCls} placeholder="10 digit" /></Field>
            </div>
            <Field label="Customer Name" required><input value={f.customer_name} onChange={set("customer_name")} className={inputCls} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Age" required><input inputMode="numeric" value={f.age} onChange={set("age")} className={inputCls} /></Field>
              <Field label="Sex" required>
                <select value={f.sex} onChange={set("sex")} className={inputCls}>
                  <option value="">Select</option><option>Male</option><option>Female</option><option>Other</option>
                </select>
              </Field>
            </div>
            <Field label="Test Name" required><input value={f.test_name} onChange={set("test_name")} className={inputCls} placeholder="e.g. CBC, Lipid Profile" /></Field>
            <Field label="Referred By (Doctor)"><input value={f.referred_by} onChange={set("referred_by")} className={inputCls} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Total Amount" required><input inputMode="numeric" value={f.total} onChange={set("total")} className={inputCls} /></Field>
              <Field label="Advance Paid"><input inputMode="numeric" value={f.advance} onChange={set("advance")} className={inputCls} /></Field>
            </div>
            <div className="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2.5">
              <span className="text-sm text-slate-600">Dues (auto)</span>
              <span className={"font-semibold tabular-nums " + (dues > 0 ? "text-amber-600" : "text-emerald-600")}>{money(dues)}</span>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Payment Mode">
                <select value={f.mode} onChange={set("mode")} className={inputCls}><option>Cash</option><option>UPI</option><option>Card</option></select>
              </Field>
              <Field label="Address"><input value={f.address} onChange={set("address")} className={inputCls} /></Field>
            </div>
            <Field label="Report Status">
              <select value={f.report_status} onChange={set("report_status")} className={inputCls}>
                {REPORT_OPTIONS.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>
            </Field>
            <button onClick={save} disabled={saving} className="w-full bg-teal-700 hover:bg-teal-800 disabled:opacity-60 text-white font-medium py-3 rounded-lg">
              {saving ? "Saving…" : "Save Entry"}
            </button>
          </div>
        </div>
      );
    }

    /* -------------------- Records -------------------- */
    const emptyRecordFilters = () => ({
      name: "",
      mobile: "",
      billNo: "",
      dateFrom: "",
      dateTo: "",
      status: "all",
    });

    function Records({ records, session, refresh }) {
      const isAdmin = session.role === "admin";
      const [q, setQ] = useState("");
      const [applied, setApplied] = useState(emptyRecordFilters);
      const [draft, setDraft] = useState(emptyRecordFilters);
      const [openSections, setOpenSections] = useState({ name: false, mobile: false, billNo: false, date: false, status: false });
      const [sheetOpen, setSheetOpen] = useState(false);
      const [active, setActive] = useState(null);

      const filtered = useMemo(() => {
        const term = q.trim().toLowerCase();
        const name = (applied.name || "").trim().toLowerCase();
        const mobile = (applied.mobile || "").trim();
        const billNo = (applied.billNo || "").trim().toLowerCase();
        const from = applied.dateFrom || "";
        const to = applied.dateTo || "";
        const status = applied.status || "all";
        return records.filter((r) => {
          if (term) {
            const blob = ((r.customer_name || "") + " " + (r.mobile || "") + " " + (r.bill_no || "") + " " + (r.test_name || "")).toLowerCase();
            if (!blob.includes(term)) return false;
          }
          if (name && !(r.customer_name || "").toLowerCase().includes(name)) return false;
          if (mobile && !(r.mobile || "").includes(mobile)) return false;
          if (billNo && !(r.bill_no || "").toLowerCase().includes(billNo)) return false;
          if (from && r.date < from) return false;
          if (to && r.date > to) return false;
          if (status === "pending" && !(r.dues > 0)) return false;
          if (status === "paid" && !(r.dues <= 0)) return false;
          if (status === "today" && r.date !== today()) return false;
          if (status === "pay_pending" && normalizeAdminPay(r.admin_payment_status) !== "Payment Pending") return false;
          if (status === "pay_received" && normalizeAdminPay(r.admin_payment_status) !== "Payment Received") return false;
          return true;
        });
      }, [records, applied, q]);

      const activeFilterCount = useMemo(() => {
        let n = 0;
        if ((applied.name || "").trim()) n++;
        if ((applied.mobile || "").trim()) n++;
        if ((applied.billNo || "").trim()) n++;
        if (applied.dateFrom || applied.dateTo) n++;
        if (applied.status && applied.status !== "all") n++;
        return n;
      }, [applied]);

      function openSheet() {
        setDraft({ ...applied });
        setOpenSections({
          name: !!(applied.name || "").trim(),
          mobile: !!(applied.mobile || "").trim(),
          billNo: !!(applied.billNo || "").trim(),
          date: !!(applied.dateFrom || applied.dateTo),
          status: !!(applied.status && applied.status !== "all"),
        });
        setSheetOpen(true);
      }
      function toggleSection(key) {
        setOpenSections((s) => ({ ...s, [key]: !s[key] }));
      }
      function setDraftField(key, value) {
        setDraft((d) => ({ ...d, [key]: value }));
      }
      function clearFilters() {
        const blank = emptyRecordFilters();
        setDraft(blank);
        setApplied(blank);
        setOpenSections({ name: false, mobile: false, billNo: false, date: false, status: false });
        setSheetOpen(false);
      }
      function applyFilters() {
        setApplied({ ...draft });
        setSheetOpen(false);
      }

      function exportCSV() {
        const head = ["Bill", "Date", "Time", "Name", "Age", "Sex", "Mobile", "Test", "Referred By", "Total", "Paid", "Dues", "Status", "Report", "Admin Payment", "Entered By"];
        const rows = records.map((r) => [
          r.bill_no, r.date, fmtTime(r.created_at), r.customer_name, r.age, r.sex, r.mobile, r.test_name, r.referred_by,
          r.total, r.paid, r.dues, r.status, normalizeReport(r.report_status), normalizeAdminPay(r.admin_payment_status), r.created_by,
        ]);
        const csv = [head, ...rows].map((row) => row.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        const a = document.createElement("a"); a.href = url; a.download = "balajee-diagonastic-records.csv"; a.click(); URL.revokeObjectURL(url);
      }

      const pillInput = "w-full px-4 py-2.5 rounded-full border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 placeholder:text-slate-400";
      const statusOptions = [
        { id: "all", label: "All" },
        { id: "pending", label: "Dues Pending" },
        { id: "paid", label: "Dues Paid" },
        { id: "today", label: "Today" },
      ];
      if (isAdmin) {
        statusOptions.push({ id: "pay_pending", label: "Payment Pending" });
        statusOptions.push({ id: "pay_received", label: "Payment Received" });
      }

      return (
        <div>
          <div className="flex items-center justify-between mb-3 gap-2">
            <h2 className="text-lg font-semibold">Records ({filtered.length}/{records.length})</h2>
            <div className="flex gap-2 items-center">
              <button
                type="button"
                onClick={openSheet}
                className="relative text-sm text-slate-700 border border-slate-200 bg-white px-3 py-1.5 rounded-lg flex items-center gap-1.5"
                title="Filters"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M3 4h18M6 12h12M10 20h4" />
                </svg>
                Filter
                {activeFilterCount > 0 && (
                  <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-teal-700 text-white text-[10px] flex items-center justify-center">
                    {activeFilterCount}
                  </span>
                )}
              </button>
              <button onClick={refresh} className="text-sm text-slate-600 border border-slate-200 bg-white px-3 py-1.5 rounded-lg">↻</button>
              {isAdmin && <button onClick={exportCSV} className="text-sm text-teal-700 border border-teal-200 bg-teal-50 px-3 py-1.5 rounded-lg">Export</button>}
            </div>
          </div>

          <div className="relative mb-3">
            <input
              value={q}
              onChange={(e) => setQ(e.target.value)}
              placeholder="Search name, mobile, bill no, test"
              className={inputCls + " pl-9"}
            />
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">⌕</span>
            {q && (
              <button type="button" onClick={() => setQ("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">✕</button>
            )}
          </div>

          {activeFilterCount > 0 && (
            <div className="mb-3 flex flex-wrap gap-1.5">
              {!!(applied.name || "").trim() && <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-1 rounded-full">Name: {applied.name}</span>}
              {!!(applied.mobile || "").trim() && <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-1 rounded-full">Mobile: {applied.mobile}</span>}
              {!!(applied.billNo || "").trim() && <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-1 rounded-full">Bill: {applied.billNo}</span>}
              {(applied.dateFrom || applied.dateTo) && (
                <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-1 rounded-full">
                  Date: {applied.dateFrom || "…"} → {applied.dateTo || "…"}
                </span>
              )}
              {applied.status && applied.status !== "all" && (
                <span className="text-[11px] bg-teal-50 text-teal-700 px-2 py-1 rounded-full">
                  {(statusOptions.find((s) => s.id === applied.status) || {}).label || applied.status}
                </span>
              )}
            </div>
          )}

          {filtered.length === 0 ? (
            <div className="text-center text-slate-400 py-16 text-sm">Koi record nahi mila.</div>
          ) : (
            <div className="space-y-2.5">
              {filtered.map((r) => (
                <button key={r.id} onClick={() => setActive(r)} className="w-full text-left bg-white rounded-xl border border-slate-200 p-3.5 hover:border-teal-300">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="font-medium text-slate-800 truncate">{r.customer_name}</div>
                      <div className="text-xs text-slate-500 mt-0.5">{r.bill_no} · {r.test_name} · {r.mobile}</div>
                      <div className="text-xs text-slate-400 mt-0.5">
                        {r.date}{r.created_at ? " · " + fmtTime(r.created_at) : ""} · {r.age}/{(r.sex || "-")[0]}
                      </div>
                    </div>
                    <div className="text-right shrink-0">
                      <div className="text-sm font-semibold tabular-nums">{money(r.total)}</div>
                      <span className={"inline-block mt-1 text-[11px] px-2 py-0.5 rounded-full " + (r.dues > 0 ? "bg-amber-100 text-amber-700" : "bg-emerald-100 text-emerald-700")}>
                        {r.dues > 0 ? "Due " + money(r.dues) : "Paid"}
                      </span>
                      <div>
                        <span className={"inline-block mt-1 text-[11px] px-2 py-0.5 rounded-full " + reportBadgeClass(r.report_status)}>
                          {normalizeReport(r.report_status)}
                        </span>
                      </div>
                      {isAdmin && (
                        <div>
                          <span className={"inline-block mt-1 text-[11px] px-2 py-0.5 rounded-full " + adminPayBadgeClass(r.admin_payment_status)}>
                            {normalizeAdminPay(r.admin_payment_status)}
                          </span>
                        </div>
                      )}
                    </div>
                  </div>
                </button>
              ))}
            </div>
          )}

          {sheetOpen && (
            <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center">
              <div className="absolute inset-0 bg-black/40" onClick={() => setSheetOpen(false)} />
              <div className="relative bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl max-h-[88vh] flex flex-col shadow-xl">
                <div className="flex items-center justify-center px-4 py-3 border-b border-slate-100 relative">
                  <h3 className="text-base font-bold text-slate-800">Filters</h3>
                  <button type="button" onClick={() => setSheetOpen(false)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl px-2">✕</button>
                </div>

                <div className="overflow-y-auto px-5 py-2 flex-1">
                  {[
                    { key: "name", label: "Name", field: "name", placeholder: "Patient name" },
                    { key: "mobile", label: "Mobile", field: "mobile", placeholder: "10 digit mobile" },
                    { key: "billNo", label: "Bill No", field: "billNo", placeholder: "e.g. INV-0001" },
                  ].map((row) => (
                    <div key={row.key} className="border-b border-slate-100 py-3">
                      <button type="button" onClick={() => toggleSection(row.key)} className="w-full flex items-center justify-between">
                        <span className="font-semibold text-slate-800">{row.label}</span>
                        <span className="text-slate-400 text-xl leading-none">{openSections[row.key] ? "−" : "+"}</span>
                      </button>
                      {openSections[row.key] && (
                        <div className="mt-3">
                          <input
                            value={draft[row.field]}
                            onChange={(e) => setDraftField(row.field, e.target.value)}
                            placeholder={row.placeholder}
                            className={pillInput}
                            inputMode={row.key === "mobile" ? "numeric" : "text"}
                          />
                        </div>
                      )}
                    </div>
                  ))}

                  <div className="border-b border-slate-100 py-3">
                    <button type="button" onClick={() => toggleSection("date")} className="w-full flex items-center justify-between">
                      <span className="font-semibold text-slate-800">Date</span>
                      <span className="text-slate-400 text-xl leading-none">{openSections.date ? "−" : "+"}</span>
                    </button>
                    {openSections.date && (
                      <div className="mt-3">
                        <div className="text-sm font-semibold text-slate-800 mb-2">Date Range</div>
                        <div className="grid grid-cols-2 gap-3">
                          <input type="date" value={draft.dateFrom} onChange={(e) => setDraftField("dateFrom", e.target.value)} className={pillInput} title="From" />
                          <input type="date" value={draft.dateTo} onChange={(e) => setDraftField("dateTo", e.target.value)} className={pillInput} title="To" />
                        </div>
                        <div className="grid grid-cols-2 gap-3 mt-1 px-1">
                          <span className="text-[11px] text-slate-400">From</span>
                          <span className="text-[11px] text-slate-400">To</span>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="py-3">
                    <button type="button" onClick={() => toggleSection("status")} className="w-full flex items-center justify-between">
                      <span className="font-semibold text-slate-800">Status</span>
                      <span className="text-slate-400 text-xl leading-none">{openSections.status ? "−" : "+"}</span>
                    </button>
                    {openSections.status && (
                      <div className="mt-3 flex flex-wrap gap-2">
                        {statusOptions.map((opt) => (
                          <button
                            key={opt.id}
                            type="button"
                            onClick={() => setDraftField("status", opt.id)}
                            className={"px-3 py-1.5 rounded-full text-sm border " + (draft.status === opt.id ? "bg-teal-700 text-white border-teal-700" : "bg-white text-slate-600 border-slate-200")}
                          >
                            {opt.label}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <div className="p-4 border-t border-slate-100 grid grid-cols-2 gap-3">
                  <button type="button" onClick={clearFilters} className="bg-teal-600 hover:bg-teal-700 text-white font-semibold tracking-wide py-3 rounded-xl shadow-sm">
                    CLEAR
                  </button>
                  <button type="button" onClick={applyFilters} className="bg-teal-600 hover:bg-teal-700 text-white font-semibold tracking-wide py-3 rounded-xl shadow-sm">
                    APPLY
                  </button>
                </div>
              </div>
            </div>
          )}

          {active && <RecordDetail record={active} session={session} onClose={() => setActive(null)} refresh={refresh} />}
        </div>
      );
    }

    /* -------------------- Record detail / clear / edit -------------------- */
    function Info({ k, v }) { return (<div><div className="text-xs text-slate-400">{k}</div><div className="text-slate-700">{v}</div></div>); }

    function RecordDetail({ record, session, onClose, refresh }) {
      const isAdmin = session.role === "admin";
      const [rec, setRec] = useState({
        ...record,
        report_status: normalizeReport(record.report_status),
        admin_payment_status: normalizeAdminPay(record.admin_payment_status),
      });
      const [mode, setMode] = useState("view");
      const [busy, setBusy] = useState(false);
      const [payAmt, setPayAmt] = useState(""); const [payMode, setPayMode] = useState("Cash"); const [payErr, setPayErr] = useState("");
      const [reportErr, setReportErr] = useState("");
      const [adminPayErr, setAdminPayErr] = useState("");
      const [ef, setEf] = useState(rec);
      const setE = (k) => (e) => setEf({ ...ef, [k]: e.target.value });

      function mapUpdated(updated) {
        return {
          ...updated,
          total: Number(updated.total), paid: Number(updated.paid), dues: Number(updated.dues),
          payments: updated.payments || [],
          report_status: normalizeReport(updated.report_status),
          admin_payment_status: normalizeAdminPay(updated.admin_payment_status),
        };
      }

      async function clearDue() {
        const amt = Number(payAmt || 0);
        if (amt <= 0) return setPayErr("Amount daaliye.");
        if (amt > rec.dues) return setPayErr("Dues se zyada nahi (" + money(rec.dues) + ").");
        setBusy(true);
        const patch = {
          paid: rec.paid + amt, dues: rec.dues - amt,
          payments: [...(rec.payments || []), { amount: amt, date: today(), mode: payMode, by: session.username, note: "Due cleared" }],
          status: rec.dues - amt <= 0 ? "Paid" : "Pending",
        };
        try {
          const updated = await updatePatient(rec.id, patch);
          logActivity({
            username: session.username, user_name: session.name, action: "due_clear",
            bill_no: rec.bill_no, patient_name: rec.customer_name,
            detail: money(amt) + " via " + payMode, amount: amt,
          });
          setRec(mapUpdated(updated));
          await refresh(); setMode("view"); setPayAmt(""); setPayErr("");
        } catch (e) { setPayErr(e.message); } finally { setBusy(false); }
      }

      async function saveReportStatus(next) {
        const value = normalizeReport(next);
        if (value === normalizeReport(rec.report_status)) return;
        setBusy(true); setReportErr("");
        try {
          const updated = await updatePatient(rec.id, { report_status: value });
          logActivity({
            username: session.username, user_name: session.name, action: "edit",
            bill_no: rec.bill_no, patient_name: rec.customer_name,
            detail: "Report → " + value, amount: null,
          });
          setRec(mapUpdated(updated));
          await refresh();
        } catch (e) {
          setReportErr(e.message || "Report update fail");
        } finally {
          setBusy(false);
        }
      }

      async function saveAdminPaymentStatus(next) {
        if (!isAdmin) return;
        const value = normalizeAdminPay(next);
        if (value === normalizeAdminPay(rec.admin_payment_status)) return;
        setBusy(true); setAdminPayErr("");
        try {
          const updated = await updatePatient(rec.id, { admin_payment_status: value });
          logActivity({
            username: session.username, user_name: session.name, action: "edit",
            bill_no: rec.bill_no, patient_name: rec.customer_name,
            detail: "Admin payment → " + value, amount: null,
          });
          setRec(mapUpdated(updated));
          await refresh();
        } catch (e) {
          setAdminPayErr(e.message || "Payment status update fail");
        } finally {
          setBusy(false);
        }
      }

      async function saveEdit() {
        const total = Number(ef.total || 0); const dues = Math.max(0, total - rec.paid);
        const patch = {
          customer_name: ef.customer_name.trim(), age: Number(ef.age), sex: ef.sex, mobile: ef.mobile,
          test_name: ef.test_name.trim(), referred_by: (ef.referred_by || "").trim(), address: (ef.address || "").trim(),
          date: ef.date, total, dues, status: dues <= 0 ? "Paid" : "Pending",
          report_status: normalizeReport(ef.report_status),
        };
        setBusy(true);
        try {
          const updated = await updatePatient(rec.id, patch);
          logActivity({
            username: session.username, user_name: session.name, action: "edit",
            bill_no: rec.bill_no, patient_name: patch.customer_name,
            detail: "Edited details · total " + money(total), amount: total,
          });
          setRec(mapUpdated(updated));
          await refresh(); setMode("view");
        } catch (e) { alert(e.message); } finally { setBusy(false); }
      }

      async function del() {
        if (!confirm("Is patient ka record delete karna hai? Ye wapas nahi aayega.")) return;
        setBusy(true);
        try {
          await deletePatient(rec.id);
          logActivity({
            username: session.username, user_name: session.name, action: "delete",
            bill_no: rec.bill_no, patient_name: rec.customer_name,
            detail: "Record deleted", amount: null,
          });
          await refresh(); onClose();
        }
        catch (e) { alert(e.message); setBusy(false); }
      }

      return (
        <div className="fixed inset-0 bg-black/40 z-30 flex items-end sm:items-center justify-center sm:p-4">
          <div className="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto">
            <div className="sticky top-0 bg-white border-b border-slate-100 px-4 py-3 flex items-center justify-between">
              <div><div className="font-semibold">{rec.customer_name}</div><div className="text-xs text-slate-500">{rec.bill_no}</div></div>
              <button onClick={onClose} className="text-slate-400 text-xl px-2">✕</button>
            </div>
            <div className="p-4">
              {mode === "view" && (
                <React.Fragment>
                  <div className="grid grid-cols-2 gap-y-3 gap-x-4 text-sm mb-4">
                    <Info k="Date" v={rec.date} /><Info k="Time" v={rec.created_at ? fmtTime(rec.created_at) : "-"} />
                    <Info k="Mobile" v={rec.mobile} />
                    <Info k="Age / Sex" v={rec.age + " / " + rec.sex} /><Info k="Test" v={rec.test_name} />
                    {rec.referred_by && <Info k="Referred By" v={rec.referred_by} />}
                    {rec.address && <Info k="Address" v={rec.address} />}
                    <Info k="Entered By" v={rec.created_by} />
                  </div>
                  <div className="mb-4">
                    <Field label="Report Status">
                      <select
                        value={normalizeReport(rec.report_status)}
                        disabled={busy}
                        onChange={(e) => saveReportStatus(e.target.value)}
                        className={inputCls}
                      >
                        {REPORT_OPTIONS.map((o) => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </Field>
                    <div className="mt-2">
                      <span className={"inline-block text-[11px] px-2 py-0.5 rounded-full " + reportBadgeClass(rec.report_status)}>
                        {normalizeReport(rec.report_status)}
                      </span>
                    </div>
                    {reportErr && <p className="text-sm text-red-600 mt-2">{reportErr}</p>}
                  </div>
                  {isAdmin && (
                    <div className="mb-4 bg-orange-50 border border-orange-100 rounded-xl p-3">
                      <Field label="Staff se payment (Admin only)">
                        <select
                          value={normalizeAdminPay(rec.admin_payment_status)}
                          disabled={busy}
                          onChange={(e) => saveAdminPaymentStatus(e.target.value)}
                          className={inputCls}
                        >
                          {ADMIN_PAY_OPTIONS.map((o) => <option key={o} value={o}>{o}</option>)}
                        </select>
                      </Field>
                      <p className="text-[11px] text-slate-500 mt-1.5">
                        Staff ne patient se paisa liya hai — aapne staff se receive kiya ya nahi.
                      </p>
                      <div className="mt-2">
                        <span className={"inline-block text-[11px] px-2 py-0.5 rounded-full " + adminPayBadgeClass(rec.admin_payment_status)}>
                          {normalizeAdminPay(rec.admin_payment_status)}
                        </span>
                      </div>
                      {adminPayErr && <p className="text-sm text-red-600 mt-2">{adminPayErr}</p>}
                    </div>
                  )}
                  <div className="bg-slate-50 rounded-xl p-3 grid grid-cols-3 text-center mb-4">
                    <div><div className="text-xs text-slate-500">Total</div><div className="font-semibold tabular-nums">{money(rec.total)}</div></div>
                    <div><div className="text-xs text-slate-500">Paid</div><div className="font-semibold tabular-nums text-emerald-600">{money(rec.paid)}</div></div>
                    <div><div className="text-xs text-slate-500">Dues</div><div className={"font-semibold tabular-nums " + (rec.dues > 0 ? "text-amber-600" : "text-slate-400")}>{money(rec.dues)}</div></div>
                  </div>
                  {(rec.payments || []).length > 0 && (
                    <div className="mb-4">
                      <div className="text-xs font-medium text-slate-500 mb-1.5">Payment history</div>
                      <div className="space-y-1">
                        {rec.payments.map((p, i) => (
                          <div key={i} className="flex justify-between text-sm bg-white border border-slate-100 rounded-lg px-3 py-1.5">
                            <span className="text-slate-500">{p.date} · {p.mode} · {p.note}</span>
                            <span className="tabular-nums font-medium">{money(p.amount)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  <div className="space-y-2">
                    {rec.dues > 0 && <button onClick={() => setMode("clear")} className="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-2.5 rounded-lg">Clear Dues</button>}
                    {isAdmin && (
                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => { setEf({ ...rec, report_status: normalizeReport(rec.report_status) }); setMode("edit"); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-lg">Edit</button>
                        <button onClick={del} disabled={busy} className="bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2.5 rounded-lg">Delete</button>
                      </div>
                    )}
                  </div>
                </React.Fragment>
              )}

              {mode === "clear" && (
                <React.Fragment>
                  <div className="mb-3 text-sm text-slate-600">Pending dues: <b className="text-amber-600">{money(rec.dues)}</b></div>
                  <Field label="Amount received" required><input inputMode="numeric" value={payAmt} onChange={(e) => setPayAmt(e.target.value)} className={inputCls} /></Field>
                  <div className="mt-3" />
                  <Field label="Payment mode"><select value={payMode} onChange={(e) => setPayMode(e.target.value)} className={inputCls}><option>Cash</option><option>UPI</option><option>Card</option></select></Field>
                  {payErr && <p className="text-sm text-red-600 mt-2">{payErr}</p>}
                  <div className="grid grid-cols-2 gap-2 mt-4">
                    <button onClick={() => setMode("view")} className="bg-slate-100 py-2.5 rounded-lg font-medium">Cancel</button>
                    <button onClick={clearDue} disabled={busy} className="bg-teal-700 text-white py-2.5 rounded-lg font-medium disabled:opacity-60">{busy ? "…" : "Record Payment"}</button>
                  </div>
                </React.Fragment>
              )}

              {mode === "edit" && (
                <React.Fragment>
                  <div className="space-y-3">
                    <Field label="Customer Name"><input value={ef.customer_name} onChange={setE("customer_name")} className={inputCls} /></Field>
                    <div className="grid grid-cols-2 gap-3">
                      <Field label="Age"><input value={ef.age} onChange={setE("age")} className={inputCls} /></Field>
                      <Field label="Sex"><select value={ef.sex} onChange={setE("sex")} className={inputCls}><option>Male</option><option>Female</option><option>Other</option></select></Field>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <Field label="Mobile"><input value={ef.mobile} onChange={setE("mobile")} className={inputCls} /></Field>
                      <Field label="Date"><input type="date" value={ef.date} onChange={setE("date")} className={inputCls} /></Field>
                    </div>
                    <Field label="Test Name"><input value={ef.test_name} onChange={setE("test_name")} className={inputCls} /></Field>
                    <Field label="Referred By"><input value={ef.referred_by || ""} onChange={setE("referred_by")} className={inputCls} /></Field>
                    <Field label="Total Amount"><input value={ef.total} onChange={setE("total")} className={inputCls} /></Field>
                    <Field label="Report Status">
                      <select value={normalizeReport(ef.report_status)} onChange={setE("report_status")} className={inputCls}>
                        {REPORT_OPTIONS.map((o) => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </Field>
                    <p className="text-xs text-slate-400">Paid ({money(rec.paid)}) fixed rahega; dues auto recalc hoga.</p>
                  </div>
                  <div className="grid grid-cols-2 gap-2 mt-4">
                    <button onClick={() => setMode("view")} className="bg-slate-100 py-2.5 rounded-lg font-medium">Cancel</button>
                    <button onClick={saveEdit} disabled={busy} className="bg-teal-700 text-white py-2.5 rounded-lg font-medium disabled:opacity-60">{busy ? "…" : "Save Changes"}</button>
                  </div>
                </React.Fragment>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* -------------------- Dashboard -------------------- */
    function BarRow({ label, value, max, color, suffix }) {
      const pct = max > 0 && Number(value) > 0 ? Math.max(4, Math.round((Number(value) / max) * 100)) : 0;
      return (
        <div className="mb-2.5">
          <div className="flex justify-between text-xs mb-1 gap-2">
            <span className="truncate text-slate-600">{label}</span>
            <span className="tabular-nums font-medium text-slate-800 shrink-0">{suffix != null ? suffix : value}</span>
          </div>
          <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
            <div className={"bar-fill h-full rounded-full " + (color || "bg-teal-600")} style={{ width: (max > 0 ? pct : 0) + "%" }} />
          </div>
        </div>
      );
    }

    function Dashboard({ records, users }) {
      const t = today();
      const [from, setFrom] = useState(t);
      const [to, setTo] = useState(t);
      const [userKey, setUserKey] = useState("all");

      const stats = useMemo(() => {
        const samples = records.filter((r) => inDateRange(r.date, from, to));
        let collected = 0;
        let cash = 0, upi = 0, card = 0, other = 0;
        const byUser = {};
        const ensure = (u) => {
          const key = u || "unknown";
          if (!byUser[key]) byUser[key] = { username: key, samples: 0, billed: 0, collected: 0, dues: 0, payments: 0 };
          return byUser[key];
        };
        samples.forEach((r) => {
          const u = ensure(r.created_by);
          u.samples += 1;
          u.billed += Number(r.total || 0);
          u.dues += Number(r.dues || 0);
        });
        records.forEach((r) => {
          paymentsOnRecord(r).forEach((p) => {
            if (!inDateRange(p.date, from, to)) return;
            collected += p.amount;
            const mode = (p.mode || "").toLowerCase();
            if (mode === "cash") cash += p.amount;
            else if (mode === "upi") upi += p.amount;
            else if (mode === "card") card += p.amount;
            else other += p.amount;
            const u = ensure(p.by || r.created_by);
            u.collected += p.amount;
            u.payments += 1;
          });
        });
        const adminReceived = samples.filter((r) => normalizeAdminPay(r.admin_payment_status) === "Payment Received");
        const adminPending = samples.filter((r) => normalizeAdminPay(r.admin_payment_status) !== "Payment Received");
        const reportCounts = { pending: 0, generated: 0, send: 0 };
        samples.forEach((r) => {
          const s = normalizeReport(r.report_status);
          if (s === "Report Generated") reportCounts.generated += 1;
          else if (s === "Report Send") reportCounts.send += 1;
          else reportCounts.pending += 1;
        });
        const days = daysInRange(from, to);
        const daily = days.map((d) => {
          const daySamples = records.filter((r) => r.date === d);
          let pay = 0;
          records.forEach((r) => {
            paymentsOnRecord(r).forEach((p) => { if (p.date === d) pay += p.amount; });
          });
          return { date: d, samples: daySamples.length, collected: pay };
        });
        const staffRows = Object.values(byUser).sort((a, b) => b.samples - a.samples || b.collected - a.collected);
        return {
          samples,
          sampleCount: samples.length,
          billed: samples.reduce((a, r) => a + Number(r.total || 0), 0),
          dues: samples.reduce((a, r) => a + Number(r.dues || 0), 0),
          collected,
          cash, upi, card, other,
          adminReceivedCount: adminReceived.length,
          adminReceivedAmt: adminReceived.reduce((a, r) => a + Number(r.paid || 0), 0),
          adminPendingCount: adminPending.length,
          reportCounts,
          daily,
          staffRows,
        };
      }, [records, from, to]);

      const shownStaff = useMemo(() => {
        if (userKey === "all") return stats.staffRows;
        return stats.staffRows.filter((u) => u.username === userKey);
      }, [stats.staffRows, userKey]);

      const userOptions = useMemo(() => {
        const set = new Set(Object.keys(users || {}));
        stats.staffRows.forEach((u) => set.add(u.username));
        return Array.from(set).filter(Boolean).sort();
      }, [users, stats.staffRows]);

      function displayName(uname) {
        return (users[uname] && users[uname].name) || uname;
      }
      function setPreset(kind) {
        const now = today();
        if (kind === "today") { setFrom(now); setTo(now); }
        if (kind === "yesterday") { const y = addDays(now, -1); setFrom(y); setTo(y); }
        if (kind === "week") { setFrom(addDays(now, -6)); setTo(now); }
        if (kind === "month") { setFrom(now.slice(0, 8) + "01"); setTo(now); }
      }
      const maxSamples = Math.max(1, ...stats.daily.map((d) => d.samples));
      const maxPay = Math.max(1, ...stats.daily.map((d) => d.collected));
      const maxUserSamples = Math.max(1, ...shownStaff.map((u) => u.samples));
      const maxUserPay = Math.max(1, ...shownStaff.map((u) => u.collected));
      const reportMax = Math.max(1, stats.reportCounts.pending, stats.reportCounts.generated, stats.reportCounts.send);

      return (
        <div>
          <h2 className="text-lg font-semibold mb-3">Dashboard</h2>

          <div className="bg-white border border-slate-200 rounded-xl p-3 mb-4">
            <div className="text-sm font-medium text-slate-700 mb-2">Date filter</div>
            <div className="flex gap-2 overflow-x-auto mb-3">
              {[
                { id: "today", label: "Today" },
                { id: "yesterday", label: "Yesterday" },
                { id: "week", label: "Last 7 days" },
                { id: "month", label: "This month" },
              ].map((p) => (
                <button key={p.id} type="button" onClick={() => setPreset(p.id)}
                  className="px-3 py-1.5 rounded-full text-xs whitespace-nowrap border bg-white text-slate-600 border-slate-200">
                  {p.label}
                </button>
              ))}
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Field label="From"><input type="date" value={from} onChange={(e) => setFrom(e.target.value)} className={inputCls} /></Field>
              <Field label="To"><input type="date" value={to} onChange={(e) => setTo(e.target.value)} className={inputCls} /></Field>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-4">
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <div className="text-xs text-slate-500">Samples received</div>
              <div className="text-xl font-bold mt-1 tabular-nums text-teal-700">{stats.sampleCount}</div>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <div className="text-xs text-slate-500">Entries added</div>
              <div className="text-xl font-bold mt-1 tabular-nums text-slate-800">{stats.sampleCount}</div>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <div className="text-xs text-slate-500">Payment received</div>
              <div className="text-xl font-bold mt-1 tabular-nums text-emerald-600">{money(stats.collected)}</div>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <div className="text-xs text-slate-500">Pending dues</div>
              <div className="text-xl font-bold mt-1 tabular-nums text-amber-600">{money(stats.dues)}</div>
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-xl p-4 mb-4 text-sm">
            <div className="font-medium mb-2">Collection breakup</div>
            <div className="flex justify-between py-1 text-slate-600"><span>Total billed</span><span className="tabular-nums font-medium">{money(stats.billed)}</span></div>
            <div className="flex justify-between py-1 text-slate-600"><span>Cash</span><span className="tabular-nums font-medium">{money(stats.cash)}</span></div>
            <div className="flex justify-between py-1 text-slate-600"><span>UPI</span><span className="tabular-nums font-medium">{money(stats.upi)}</span></div>
            <div className="flex justify-between py-1 text-slate-600"><span>Card</span><span className="tabular-nums font-medium">{money(stats.card)}</span></div>
            <div className="flex justify-between py-1 text-slate-600"><span>Admin received from staff</span><span className="tabular-nums font-medium text-emerald-700">{stats.adminReceivedCount} · {money(stats.adminReceivedAmt)}</span></div>
            <div className="flex justify-between py-1 text-slate-600"><span>Admin payment still pending</span><span className="tabular-nums font-medium text-orange-700">{stats.adminPendingCount}</span></div>
          </div>

          <div className="bg-white border border-slate-200 rounded-xl p-4 mb-4">
            <div className="font-medium mb-3">Daily samples</div>
            {stats.daily.length === 0 ? (
              <div className="text-sm text-slate-400">No days in range.</div>
            ) : stats.daily.map((d) => (
              <BarRow key={"s-" + d.date} label={d.date.slice(5)} value={d.samples} max={maxSamples} color="bg-teal-600" />
            ))}
          </div>

          <div className="bg-white border border-slate-200 rounded-xl p-4 mb-4">
            <div className="font-medium mb-3">Daily payment received</div>
            {stats.daily.length === 0 ? (
              <div className="text-sm text-slate-400">No days in range.</div>
            ) : stats.daily.map((d) => (
              <BarRow key={"p-" + d.date} label={d.date.slice(5)} value={d.collected} max={maxPay} color="bg-emerald-500" suffix={money(d.collected)} />
            ))}
          </div>

          <div className="bg-white border border-slate-200 rounded-xl p-4 mb-4">
            <div className="font-medium mb-3">Reports</div>
            <BarRow label="Report Pending" value={stats.reportCounts.pending} max={reportMax} color="bg-amber-500" />
            <BarRow label="Report Generated" value={stats.reportCounts.generated} max={reportMax} color="bg-sky-500" />
            <BarRow label="Report Send" value={stats.reportCounts.send} max={reportMax} color="bg-emerald-500" />
          </div>

          <div className="bg-white border border-slate-200 rounded-xl p-4 mb-4">
            <div className="flex items-center justify-between gap-2 mb-3">
              <div className="font-medium">Staff tracking</div>
            </div>
            <select value={userKey} onChange={(e) => setUserKey(e.target.value)} className={inputCls + " mb-4"}>
              <option value="all">All staff</option>
              {userOptions.map((u) => <option key={u} value={u}>{displayName(u)} ({u})</option>)}
            </select>
            {shownStaff.length === 0 ? (
              <div className="text-sm text-slate-400">Is date range me koi staff activity nahi mili.</div>
            ) : (
              shownStaff.map((u) => (
                <div key={u.username} className="border border-slate-100 rounded-xl p-3 mb-2">
                  <div className="flex justify-between items-center mb-2">
                    <div>
                      <div className="font-medium text-sm">{displayName(u.username)}</div>
                      <div className="text-[11px] text-slate-400">{u.username}</div>
                    </div>
                    <div className="text-right text-xs text-slate-500">
                      {u.samples} samples
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2 text-center text-xs mb-2">
                    <div className="bg-slate-50 rounded-lg py-2"><div className="text-slate-400">Samples</div><div className="font-semibold tabular-nums">{u.samples}</div></div>
                    <div className="bg-emerald-50 rounded-lg py-2"><div className="text-slate-400">Payment</div><div className="font-semibold tabular-nums text-emerald-700">{money(u.collected)}</div></div>
                    <div className="bg-amber-50 rounded-lg py-2"><div className="text-slate-400">Dues</div><div className="font-semibold tabular-nums text-amber-700">{money(u.dues)}</div></div>
                  </div>
                  <BarRow label="Samples" value={u.samples} max={maxUserSamples} color="bg-teal-600" />
                  <BarRow label="Payment added" value={u.collected} max={maxUserPay} color="bg-emerald-500" suffix={money(u.collected)} />
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    /* -------------------- Activity Log -------------------- */
    const ACT_META = {
      entry:     { label: "New entry",   cls: "bg-teal-100 text-teal-700" },
      due_clear: { label: "Due cleared", cls: "bg-emerald-100 text-emerald-700" },
      edit:      { label: "Edited",      cls: "bg-amber-100 text-amber-700" },
      delete:    { label: "Deleted",     cls: "bg-red-100 text-red-700" },
      login:     { label: "Login",       cls: "bg-slate-100 text-slate-600" },
    };

    function Activity() {
      const [rows, setRows] = useState([]);
      const [loading, setLoading] = useState(true);
      const [action, setAction] = useState("all");
      const [user, setUser] = useState("all");
      const [err, setErr] = useState("");

      async function load() {
        try { setRows(await listActivity()); setErr(""); }
        catch (e) { setErr(e.message || "Load failed"); }
        finally { setLoading(false); }
      }
      useEffect(() => {
        load();
        const ch = db.channel("realtime-activity")
          .on("postgres_changes", { event: "INSERT", schema: "public", table: "activity" }, (payload) => {
            setRows((r) => [payload.new, ...r]);
          }).subscribe();
        return () => { db.removeChannel(ch); };
      }, []);

      const users = useMemo(() => Array.from(new Set(rows.map((r) => r.username).filter(Boolean))), [rows]);
      const filtered = rows.filter((r) => (action === "all" || r.action === action) && (user === "all" || r.username === user));

      const groups = [];
      let cur = null;
      filtered.forEach((r) => {
        const day = fmtDay(r.created_at);
        if (!cur || cur.day !== day) { cur = { day, items: [] }; groups.push(cur); }
        cur.items.push(r);
      });

      function exportCSV() {
        const head = ["Date", "Time", "User", "Username", "Action", "Bill", "Patient", "Detail", "Amount"];
        const body = filtered.map((r) => [fmtDay(r.created_at), fmtTime(r.created_at), r.user_name, r.username, (ACT_META[r.action] || {}).label || r.action, r.bill_no, r.patient_name, r.detail, r.amount]);
        const csv = [head, ...body].map((row) => row.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        const a = document.createElement("a"); a.href = url; a.download = "activity-log.csv"; a.click(); URL.revokeObjectURL(url);
      }

      const chips = [
        { id: "all", label: "All" },
        { id: "entry", label: "Entries" },
        { id: "due_clear", label: "Dues" },
        { id: "edit", label: "Edits" },
        { id: "delete", label: "Deletes" },
        { id: "login", label: "Logins" },
      ];

      return (
        <div>
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-lg font-semibold">Activity Log</h2>
            <div className="flex gap-2">
              <button onClick={load} className="text-sm text-slate-600 border border-slate-200 bg-white px-3 py-1.5 rounded-lg">↻</button>
              <button onClick={exportCSV} className="text-sm text-teal-700 border border-teal-200 bg-teal-50 px-3 py-1.5 rounded-lg">Export</button>
            </div>
          </div>

          <div className="flex gap-2 mb-3 overflow-x-auto">
            {chips.map((c) => (
              <button key={c.id} onClick={() => setAction(c.id)}
                className={"px-3 py-1.5 rounded-full text-sm whitespace-nowrap border " + (action === c.id ? "bg-teal-700 text-white border-teal-700" : "bg-white text-slate-600 border-slate-200")}>{c.label}</button>
            ))}
          </div>

          <select value={user} onChange={(e) => setUser(e.target.value)} className={inputCls + " mb-4"}>
            <option value="all">All users</option>
